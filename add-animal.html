<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Species · Wildlife Explorer</title><link rel="stylesheet" href="styles.css"></head><body><header><b>✦ Wildlife Explorer</b><nav><a href="index.html">Home</a><a href="animals.html">Explore</a><a href="add-animal.html">Add Species</a></nav></header><main><small>FIELD JOURNAL</small><h1 id="title">Add a species</h1><div id="loginPanel" class="hidden"><h2>Editor sign in</h2><p>Sign in with your editor account to add or change species.</p><label>Email<input id="loginEmail" type="email" autocomplete="username"></label><label>Password<input id="loginPassword" type="password" autocomplete="current-password"></label><p><button class="btn" id="loginButton" type="button">Sign in</button></p><p id="loginError" role="alert"></p></div><p id="editorStatus"></p><p id="importPanel" class="hidden"><button class="btn alt" type="button" id="importButton">Import species saved in this browser</button> <span id="importStatus"></span></p><form id="form"><section><h2>Identity & taxonomy</h2><div class="formgrid">
<label>Common name<input name="commonName" required></label><label>Scientific name<input name="scientificName"></label><label>Category<select name="category" required><option value="">Choose...</option><option>Birds</option><option>Mammals</option><option>Fish</option><option>Reptiles</option><option>Amphibians</option><option>Invertebrates</option><option>Other</option></select></label>
<label>Order — scientific<input name="order"></label><label>Order — common name<input name="orderCommon" placeholder="e.g. Passerines"></label><label>Family — scientific<input name="family"></label><label>Family — common name<input name="familyCommon" placeholder="e.g. Thrushes"></label><label>Genus — scientific<input name="genus"></label><label>Genus — common name<input name="genusCommon" placeholder="e.g. True thrushes"></label>
</div></section><section><h2>Range & natural history</h2><div class="formgrid"><label>Countries<textarea name="countries"></textarea></label><label>Habitat<textarea name="habitat"></textarea></label><label>Range map URL<input name="rangeMap" type="url"></label><label>Generational length<input name="generationLength"></label><label>Migratory<select name="migratory"><option value="">Choose...</option><option>Resident</option><option>Migratory</option><option>Partially migratory</option><option>Nomadic</option><option>Unknown</option></select></label><label class="wide">Diet<textarea name="diet"></textarea></label></div></section><section><h2>Conservation</h2><div class="formgrid"><label>Status<input name="status"></label><label>Population trend<input name="trend"></label><label class="wide">Threats<textarea name="threats"></textarea></label></div></section><section><h2>Photographs</h2><div class="formgrid"><label class="wide">Main photo URL<input name="photo" type="url"></label><label class="wide">Gallery photo URLs<textarea name="gallery" placeholder="One URL per line"></textarea></label></div></section><section><h2>Facts</h2><label class="wide">Facts<textarea name="facts" placeholder="One fact per line"></textarea></label></section><p id="formError" role="alert" class="hidden" style="color:#8b3f35"></p><p><button class="btn" id="save">Save species</button> <button class="btn danger hidden" type="button" id="delete">Delete species</button> <a class="btn alt" href="animals.html">Cancel</a></p></form></main><footer>Wildlife Explorer · Species editor</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="db-config.js"></script><script src="app.js"></script></body></html>
